<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
	"http://www.w3.org/TR/REC-html40/loose.dtd">
<html lang="ja">
  <head>
  <meta http-equiv="content-type" content="text/html; charset=EUC-JP">
    <title>
      読者のご意見、ご感想などなど登録ページ
    </title>
<meta http-equiv="Content-Style-Type" content="text/css">
<style type="text/css">
<!--
 DIV.c1 {text-align: center}
-->
</style>
  </head>
  <body bgcolor="#E0E0FF">
    <div class="c1">
      <h1>
        ユーザのご意見、突っ込みコーナ
      </h1>
    </div>
    ご意見、ご感想がなくても、「読んでいるよ」ということで、
    あなたの名前の所、ハンドル名でも結構ですので、入力してください。
    日記を書いている人の励みになります。お願いします。<br>
     
    <form method="POST" action="./make-rurimap.cgi">
      お名前(ハンドル名でもOK):<input name="NAME" type= 
      "text" size="30" value="お名前"><br>
       メールアドレス(よろしければお教え下さい): <input
      name="EMAIL" type="text" size="50" value="you@somewhere.org"><br>
       ホームページのアドレス(よろしければお教え下さい):
      <input name="URL" type="text" size="50" value="http://"><br>
       ご意見ご感想:<br>
       <textarea name="MSG" cols="60" rows="4">感想など</textarea><br>
       <input type="submit" value="submit"><input type="reset"
      value="reset">
    </form>
  </body>
</html>
